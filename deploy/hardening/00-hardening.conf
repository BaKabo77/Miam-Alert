# Durcissement SSH du serveur Miam'Alert.
# Installé dans /etc/ssh/sshd_config.d/00-hardening.conf (root:root, 644).
# Préfixe 00 : ce fichier est lu en premier, et pour sshd la PREMIÈRE valeur lue l'emporte
# (50-cloud-init.conf, ajouté par l'hébergeur, réactive les mots de passe).

# Connexion uniquement par clé : les robots qui essaient des mots de passe n'ont aucune chance.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# Jamais de connexion directe en root : on se connecte avec son compte, puis sudo (mot de passe).
PermitRootLogin no
AllowUsers kabo deploy

# Moins d'essais et de temps laissés à une connexion non authentifiée.
MaxAuthTries 3
LoginGraceTime 30
# Deux sessions au plus par connexion (multiplexage) : assez pour un humain.
MaxSessions 2

# Aucun transfert : ni affichage graphique, ni agent SSH (une clé chargée sur le PC serait utilisable
# depuis un serveur compromis), ni tunnel. Une clé volée ne donne donc aucun passage réseau vers la
# base, qui vit sur le réseau interne de Docker. Accès à la base : sudo docker compose exec db psql.
DisableForwarding yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no

# Journal détaillé : l'empreinte de la clé utilisée est enregistrée à chaque connexion (quelle clé,
# pas seulement quel compte). Indispensable pour savoir quelle clé révoquer après un incident.
LogLevel VERBOSE

# Coupe les sessions inactives (10 min sans réponse du client). Ce contrôle passe par le canal
# chiffré ; le « keepalive » TCP, en clair et falsifiable, est désactivé.
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no
