# Réglages du noyau de Miam'Alert, en plus de ceux d'Ubuntu (/etc/sysctl.d/10-*.conf).
# Installé dans /etc/sysctl.d/99-miam-hardening.conf (root:root, 644), lu en dernier.
#
# NE PAS TOUCHER à net.ipv4.ip_forward : Docker en a besoin (valeur 1) pour faire passer le trafic
# entre Internet et les conteneurs. Le désactiver couperait le site.

# ---------- Réseau ----------

# Filtrage strict de l'adresse source : un paquet n'est accepté que s'il arrive par l'interface qui
# servirait à lui répondre. Bloque les paquets à adresse source usurpée (Ubuntu : 2, mode souple).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Le serveur n'envoie pas de redirections ICMP (il n'est pas un routeur pour son réseau) et n'accepte
# pas celles des passerelles « de confiance » : une redirection permet de détourner du trafic.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Journaliser les paquets aux adresses impossibles (signe d'usurpation ou de mauvaise configuration).
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Protection contre une attaque qui ferme les connexions en attente (RFC 1337).
net.ipv4.tcp_rfc1337 = 1

# ---------- Noyau ----------

# Adresses mémoire du noyau masquées à tous, root compris : elles aident à contourner l'ASLR dans
# une élévation de privilèges (Ubuntu : 1, masquées aux seuls utilisateurs ordinaires).
kernel.kptr_restrict = 2

# Seul un administrateur (CAP_SYS_PTRACE) peut s'attacher à un autre processus pour lire sa mémoire
# (mots de passe, clés). Ubuntu : 1, un processus peut espionner ses propres descendants.
kernel.yama.ptrace_scope = 2

# Compilateur BPF durci contre les attaques par pulvérisation (JIT spraying).
net.core.bpf_jit_harden = 2

# Pas de chargement d'un autre noyau à chaud (kexec) : un intrus root ne peut pas remplacer le noyau
# sans redémarrer. Réglage à sens unique jusqu'au prochain démarrage.
kernel.kexec_load_disabled = 1

# Touches « magiques » du noyau désactivées (redémarrage, arrêt depuis la console).
kernel.sysrq = 0

# Pas de chargement automatique de disciplines de ligne de terminal rarement utilisées, source de
# failles connues.
dev.tty.ldisc_autoload = 0

# ---------- Fichiers ----------

# Pas de vidage mémoire (core dump) des programmes setuid : il pourrait contenir des secrets.
fs.suid_dumpable = 0

# Aucun vidage mémoire, pour aucun processus : ils sont envoyés vers /bin/false, qui les jette.
# (apport, l'outil de rapport de plantage d'Ubuntu, est désactivé : il remplacerait ce réglage.)
kernel.core_pattern = |/bin/false

# Pas d'écriture dans un tube nommé (FIFO) d'un autre utilisateur dans un dossier partagé (/tmp).
fs.protected_fifos = 2
