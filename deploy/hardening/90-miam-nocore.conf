# Pas de vidage mémoire (core dump) pour les sessions des utilisateurs du serveur.
# Installé dans /etc/security/limits.d/90-miam-nocore.conf (root:root, 644).
# Un vidage mémoire contient tout ce que le processus avait en mémoire : mots de passe, clés,
# données. Le réglage du noyau kernel.core_pattern (99-miam-hardening.conf) les écarte aussi pour
# les services.
* hard core 0
