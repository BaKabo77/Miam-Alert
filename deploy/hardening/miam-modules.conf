# Modules du noyau interdits de chargement sur le serveur Miam'Alert.
# Installé dans /etc/modprobe.d/miam-modules.conf (root:root, 644).
#
# Le noyau charge un module à la demande, par exemple quand un programme ouvre une connexion d'un
# protocole rare. Ces modules-là ne servent à rien ici et ont un historique de failles permettant
# une élévation de privilèges : on les rend impossibles à charger (« install … /bin/false »),
# et on retire leurs alias de chargement automatique (« blacklist »).

# Protocoles réseau rares (télécoms, grappes de calcul) : ni Docker ni l'application ne s'en servent.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# Clés et disques USB : un serveur virtuel n'en a pas.
install usb-storage /bin/false
blacklist usb-storage
