# Journal système de Miam'Alert. Installation : /etc/systemd/journald.conf.d/miam.conf
# (root:root, 644), puis systemctl restart systemd-journald.
[Journal]
# Conservé sur le disque (et non en mémoire seulement) : il survit aux redémarrages.
Storage=persistent
# Conservation locale limitée (il contient des adresses IP) : 30 jours, 2 Go au plus. L'archive
# chiffrée de 6 mois est chez Backblaze (miam-logship).
MaxRetentionSec=30day
SystemMaxUse=2G
