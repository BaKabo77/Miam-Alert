# Environnement de DÉVELOPPEMENT uniquement.
# La production aura son propre Dockerfile multi-stage et ne publiera ni la BDD ni Adminer.

name: miam-alert

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Aucun port publié : la BDD n'est joignable que depuis le réseau Docker (backend, adminer).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    # 127.0.0.1 : accessible depuis ce poste seulement, pas depuis le réseau local.
    ports:
      - '127.0.0.1:8080:8080'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Code monté pour le rechargement à chaud.
      - ./backend:/app
      # Volume anonyme : garde les node_modules installés dans l'image (non écrasés par le montage).
      - /app/node_modules
      
  frontend:
  build:
    context: ./frontend
    dockerfile: Dockerfile.dev
  restart: unless-stopped
  # Pas d'env_file : le front ne reçoit AUCUN secret du .env. Tout ce qui est donné au front
  # finit dans le code envoyé au navigateur, donc public.
  depends_on:
    - backend
  ports:
    - '127.0.0.1:5173:5173'
  volumes:
    - ./frontend:/app
    - /app/node_modules


volumes:
  db-data:
