# Pipeline d'intégration et de déploiement continus de Miam'Alert.
# - Sur chaque merge request et sur develop / main : qualité, tests, sécurité. Une MR ne peut être
#   fusionnée que si tout est vert (réglage « Pipelines must succeed »).
# - Sur un tag de version (vX.Y.Z, tags protégés) : en plus, construction des images, analyse
#   Trivy, puis déploiement en production déclenché à la main (bouton).

stages:
  - check
  - test
  - secret-detection
  - security
  - build
  - scan
  - deploy

# Une seule exécution par push : pipeline de MR s'il y en a une ouverte, sinon pipeline de branche.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  # Un nouveau push sur la même branche annule le pipeline devenu obsolète.
  interruptible: true

variables:
  # Valeurs propres à la CI, sans aucune valeur réelle : la base n'existe que le temps du job.
  POSTGRES_USER: miam_alert
  POSTGRES_PASSWORD: ci-only-password
  POSTGRES_DB: miam_alert_test
  DATABASE_URL: postgresql://miam_alert:ci-only-password@db:5432/miam_alert_test?schema=public
  DATABASE_URL_TEST: $DATABASE_URL
  npm_config_cache: $CI_PROJECT_DIR/.npm

.backend:
  image: node:24-alpine
  before_script:
    - cd backend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx prisma generate
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm/
    policy: pull-push

quality:
  extends: .backend
  stage: check
  script:
    - npm run lint
    - npx tsc --noEmit
    - npm run build
    - npm test

# Le front n'avait aucun contrôle de qualité dans le pipeline (seul l'audit npm) : lint,
# compilation TypeScript et build de production, comme pour l'API.
frontend:
  image: node:24-alpine
  stage: check
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - npm run lint
    - npm run build
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
    policy: pull-push

e2e:
  extends: .backend
  stage: test
  # Vraie base PostgreSQL, détruite à la fin du job : les tests IDOR et d'authentification
  # tournent dans les mêmes conditions qu'en local.
  services:
    - name: postgres:16-alpine
      alias: db
    # Faux serveur d'emails : les emails envoyés pendant les tests sont capturés, aucun ne sort.
    - name: axllent/mailpit:v1.27.11
      alias: mailpit
  variables:
    NODE_ENV: test
    PORT: '3000'
    CORS_ORIGINS: http://localhost:5173
    APP_URL: http://localhost:5173
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    MAIL_FROM: no-reply@miam-alert.fr
  script:
    # Secret JWT généré à chaque exécution : aucune valeur, même factice, n'est écrite dans le dépôt.
    - export JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
    - npm run test:e2e

audit:
  image: node:24-alpine
  stage: security
  # Un job par application, exécutés en parallèle.
  parallel:
    matrix:
      - APP: [backend, frontend]
  # npm audit n'a besoin que du lockfile : rien n'est installé, aucun script tiers n'est exécuté.
  script:
    - cd $APP
    - npm audit --audit-level=high
  # Une vulnérabilité publiée hier peut faire échouer un code qui n'a pas changé :
  # le job reste bloquant, c'est voulu (on corrige avant de fusionner).

# Analyses de sécurité fournies par GitLab (disponibles dans l'offre gratuite) :
# détection de secrets dans le code et analyse statique du code (SAST).
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

# ---------- Livraison (tags de version uniquement) ----------

.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Construction des 5 images de production (dont la mesure d'audience) et envoi dans le registre du projet GitLab.
# Le serveur ne construit plus rien : il télécharge exactement ce qui a été testé et analysé.
build-images:
  extends: .release
  stage: build
  # Seul job à exiger Docker-in-Docker (service privilégié) : il tourne sur un runner dédié, réservé
  # aux tags protégés et limité aux images Docker officielles (voir deploy/runner/README.md).
  tags: [docker-build]
  image: docker:29.9.0
  services:
    - docker:29.9.0-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    # Adresse publique de l'API, inscrite dans le front et dans sa CSP (ce n'est pas un secret).
    PUBLIC_API_URL: https://api.miam-alert.fr
    # Mesure d'audience : STATS_WEBSITE_ID est une variable GitLab (identifiant du site dans Umami,
    # pas un secret). Vide : le front est construit sans mesure d'audience.
  before_script:
    # Jeton propre à ce job, valable le temps du job : aucun identifiant permanent dans la CI.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # --pull : toujours partir des images de base les plus récentes (correctifs de sécurité).
    - docker build --pull --target runtime -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_TAG" backend
    - docker build --pull --target migrate -t "$CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_TAG" backend
    - |
      if [ -n "${STATS_WEBSITE_ID:-}" ]; then STATS_URL=https://stats.miam-alert.fr; else STATS_URL=; fi
      docker build --pull --build-arg VITE_API_URL="$PUBLIC_API_URL" \
        --build-arg VITE_STATS_URL="$STATS_URL" --build-arg VITE_STATS_WEBSITE_ID="${STATS_WEBSITE_ID:-}" \
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_TAG" frontend
    - docker build --pull -t "$CI_REGISTRY_IMAGE/proxy:$CI_COMMIT_TAG" deploy/caddy
    - docker build --pull -t "$CI_REGISTRY_IMAGE/stats:$CI_COMMIT_TAG" deploy/analytics
    - for image in api migrate web proxy stats; do docker push --quiet "$CI_REGISTRY_IMAGE/$image:$CI_COMMIT_TAG"; done

# Analyse des images : le déploiement est impossible tant qu'une faille haute ou critique
# disposant d'un correctif subsiste (dans le système de base comme dans les dépendances).
scan-images:
  extends: .release
  stage: scan
  needs: [build-images]
  image:
    name: aquasec/trivy:0.75.0
    entrypoint: ['']
  parallel:
    matrix:
      - IMAGE: [api, migrate, web, proxy, stats]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_NO_PROGRESS: 'true'
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE/$IMAGE:$CI_COMMIT_TAG"

# Mise en production, déclenchée à la main depuis GitLab (bouton « play » du job).
# Connexion avec l'utilisateur `deploy` du serveur : sa clé ne peut lancer QUE le script de
# déploiement, avec une version vX.Y.Z (voir deploy/server/README.md). Les variables DEPLOY_* sont
# « protégées » : elles ne sont fournies qu'aux pipelines des tags protégés (v*).
deploy-production:
  extends: .release
  stage: deploy
  needs: [scan-images]
  when: manual
  # Pas d'annulation par un pipeline plus récent : un déploiement ne s'interrompt pas en cours.
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://miam-alert.fr
  image: alpine:3.24
  before_script:
    - apk add --no-cache openssh-client >/dev/null
    - install -m 700 -d ~/.ssh
    - install -m 600 "$DEPLOY_SSH_KEY" ~/.ssh/id_deploy
    # Empreinte du serveur fixée à l'avance : jamais de confiance aveugle à la première connexion.
    - echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "deploy@$DEPLOY_HOST" "$CI_COMMIT_TAG"
